name: RC25 Intel Mac bootstrap and qualification

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Full native build or bounded Swift wrapper refresh
        type: choice
        options: [full, wrapper-refresh]
        default: full
      baseline_zip_sha256:
        description: Independently verified SHA256 of fixed 6fa60a6b77e8 draft ZIP (refresh only)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: macos-intel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  intel:
    if: github.repository == 'JmooreOsirs/amplifai-phone-companion' && github.ref == 'refs/heads/codex/desktop-updates-oct14'
    # Standard runner on this public repository: no larger/paid runner, no Homebrew.
    runs-on: macos-15-intel
    timeout-minutes: 90
    permissions:
      contents: write # draft candidate only; no public release
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      AMPLIFAI_TARGET_ARCH: x86_64
      RUSTUP_TOOLCHAIN: '1.98.0'
      PYTHONNOUSERSITE: '1'
      BUILD_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0 # Compare immutable helper/framework inputs with the fixed qualified commit.
      - name: Validate bounded dispatch
        shell: bash
        env:
          BASELINE_ZIP_SHA256: ${{ inputs.baseline_zip_sha256 }}
        run: |
          set -euo pipefail
          case "$BUILD_MODE" in
            full) test -z "$BASELINE_ZIP_SHA256" ;;
            wrapper-refresh) [[ "$BASELINE_ZIP_SHA256" =~ ^[0-9a-f]{64}$ ]] ;;
            *) exit 2 ;;
          esac
      - name: Verify native Intel runner and prepare pinned Python
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          sw_vers
          swift --version
          mkdir -p "$RUNNER_TEMP/intel-python"
          curl --fail --location --retry 3 'https://github.com/astral-sh/python-build-standalone/releases/download/20261009/cpython-3.12.15%2B20261009-x86_64-apple-darwin-install_only_stripped.tar.gz' -o "$RUNNER_TEMP/intel-python/python.tar.gz"
          echo "fb3187d95334813b88940db0f1ca57b84cedfd552739c3a5771c3ea0e49988c9  $RUNNER_TEMP/intel-python/python.tar.gz" | shasum -a 256 --check
          tar -xzf "$RUNNER_TEMP/intel-python/python.tar.gz" -C "$RUNNER_TEMP/intel-python"
          echo "$RUNNER_TEMP/intel-python/python/bin" >> "$GITHUB_PATH"
          if [ "$BUILD_MODE" = full ]; then
            rustup toolchain install 1.98.0 --profile minimal
            rustc --version
          fi
      - name: Prepare exact Intel dependency wheels
        if: inputs.mode == 'full'
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import platform,sys; assert platform.machine()=="x86_64"; assert sys.version_info[:3]==(3,12,15)'
          python3 source/script/prepare_intel_dependencies.py --output-dir "$RUNNER_TEMP/intel-deps"
          python3 -m venv "$RUNNER_TEMP/intel-venv"
          "$RUNNER_TEMP/intel-venv/bin/python" -m pip install --no-index --find-links "$RUNNER_TEMP/intel-deps/wheelhouse" --require-hashes -r "$RUNNER_TEMP/intel-deps/runtime-requirements.lock"
          echo "$RUNNER_TEMP/intel-venv/bin" >> "$GITHUB_PATH"
      - name: Collect exact Intel Python source and notices
        if: inputs.mode == 'full'
        shell: bash
        run: |
          set -euo pipefail
          python source/script/collect_intel_python_sources.py --runtime-archive "$RUNNER_TEMP/intel-python/python.tar.gz" --output-dir "$RUNNER_TEMP/intel-python-sources" --reuse-source-dir "$RUNNER_TEMP/intel-deps/source-inputs"
      - name: Test build guards and source collection regressions
        if: inputs.mode == 'full'
        shell: bash
        env:
          PYTHONPATH: source/collector:source/collector/tests:source/script
        run: |
          set -euo pipefail
          python -m unittest discover -s source/script -p 'test_*intel*.py' -v
          python source/script/test_macos_architecture.py -v
          python source/script/test_macos_wrapper.py -v
          python -m unittest test_metadata test_ios_backup test_agent test_bridge test_bridge_ack test_sqlite_size_compat test_sqlite_messages_size_compat test_sqlite_encrypted_size_compat test_nonfinite_duration_pipeline test_workspace test_backup_capacity test_backup_stream test_backup_watchdog test_contact_provenance test_companion_status -v
      - name: Build complete Intel app and audit every Mach-O component
        if: inputs.mode == 'full'
        shell: bash
        run: |
          set -euo pipefail
          python source/script/build_macos_intel_candidate.py --output "$RUNNER_TEMP/intel-build" --dependency-receipt "$RUNNER_TEMP/intel-deps/receipt.json" --python-sources "$RUNNER_TEMP/intel-python-sources" --enable-published-updates
      - name: Run native flow, updater gates, status mode, and actual frozen worker checks
        if: inputs.mode == 'full'
        shell: bash
        env:
          PYTHONPATH: source/collector:source/collector/tests
        run: |
          set -euo pipefail
          sh source/collector/macos/Tests/check_flow.sh
          sh source/collector/macos/Tests/check_updater.sh
          sh source/collector/macos/Tests/check_contact_provenance.sh
          helper="$RUNNER_TEMP/intel-build/AMPLIFai Phone Intel Test.app/Contents/Resources/helper/amplifai-agent"
          python source/collector/tests/qualify_frozen_encrypted_worker.py --helper "$helper" > "$RUNNER_TEMP/intel-build/frozen-worker-receipt.json"
          python source/script/verify_frozen_metadata.py --helper "$helper" --expected-helper-sha256 "$(shasum -a 256 "$helper" | cut -d ' ' -f 1)" --tests source/collector/tests --capacity-tests > "$RUNNER_TEMP/intel-build/frozen-metadata-receipt.json"
      - name: Package exact build and corresponding source for Jeff
        if: inputs.mode == 'full'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/intel-delivery"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/intel-build/AMPLIFai Phone Intel Test.app" "$RUNNER_TEMP/intel-delivery/AMPLIFai-Phone-Intel-rc25-candidate.zip"
          cp "$RUNNER_TEMP/intel-build/"*.json "$RUNNER_TEMP/intel-delivery/"
          cp "$RUNNER_TEMP/intel-deps/receipt.json" "$RUNNER_TEMP/intel-delivery/dependency-receipt.json"
          mkdir -p "$RUNNER_TEMP/intel-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/intel-source"
          cp -R "$RUNNER_TEMP/intel-deps/source-inputs" "$RUNNER_TEMP/intel-source/intel-dependency-source-inputs"
          cp -R "$RUNNER_TEMP/intel-python-sources" "$RUNNER_TEMP/intel-source/intel-python-source-inputs"
          tar -czf "$RUNNER_TEMP/intel-delivery/AMPLIFai-Intel-Build-Source.tar.gz" -C "$RUNNER_TEMP" intel-source
          cd "$RUNNER_TEMP/intel-delivery"
          shasum -a 256 ./* > SHA256SUMS
      - name: Download the fixed successful native Intel baseline
        if: inputs.mode == 'wrapper-refresh'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run view 38636941728 --json headSha,status,conclusion > "$RUNNER_TEMP/intel-baseline-run.json"
          gh release view intel-rc25-candidate-6fa60a6b77e8 --json tagName,targetCommitish,isDraft > "$RUNNER_TEMP/intel-baseline-release.json"
          python3 - "$RUNNER_TEMP" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          run = json.loads((root / 'intel-baseline-run.json').read_text())
          release = json.loads((root / 'intel-baseline-release.json').read_text())
          commit = '6fa60a6b77e8a676556ce6bc68ee61235d34e750'
          assert run == {'headSha': commit, 'status': 'completed', 'conclusion': 'success'}, run
          assert release == {'tagName': 'intel-rc25-candidate-6fa60a6b77e8', 'targetCommitish': commit, 'isDraft': True}, release
          PY
          gh release download intel-rc25-candidate-6fa60a6b77e8 --dir "$RUNNER_TEMP/intel-baseline"
      - name: Refresh only the Swift wrapper and changed gates
        if: inputs.mode == 'wrapper-refresh'
        shell: bash
        env:
          BASELINE_ZIP_SHA256: ${{ inputs.baseline_zip_sha256 }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s source/script -p 'test_refresh_macos_intel_wrapper.py' -v
          python3 source/script/refresh_macos_intel_wrapper.py --baseline-dir "$RUNNER_TEMP/intel-baseline" --baseline-zip-sha256 "$BASELINE_ZIP_SHA256" --output "$RUNNER_TEMP/intel-refresh"
          mv "$RUNNER_TEMP/intel-refresh/delivery" "$RUNNER_TEMP/intel-delivery"
      - name: Retain candidate as an unpublished draft
        if: github.repository == 'JmooreOsirs/amplifai-phone-companion' && github.ref == 'refs/heads/codex/desktop-updates-oct14'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="intel-rc25-candidate-${GITHUB_SHA:0:12}"
          gh release create "$tag" "$RUNNER_TEMP/intel-delivery/"* --target "$GITHUB_SHA" --draft --title 'Unpublished Intel Mac RC25 bootstrap candidate for signing and device testing' --notes 'Ad-hoc signed Intel RC25 bootstrap candidate derived from the published RC24 source ZIP. candidate-receipt.json identifies full-build versus wrapper-refresh evidence. A wrapper refresh preserves the exact fixed 6fa native helper/runtime and retains labeled baseline dependency/frozen-worker qualification while rerunning current Swift updater/status/closed-stdin and native closure checks. Not Developer ID signed or notarized. Physical Intel macOS 14, real iPhone collection and hosted account save/report remain separate acceptance checks. Final signed feed/archive qualification and explicit release promotion remain required. Corresponding current authored source and exact baseline third-party source inputs are attached.'
