name: Windows source and package qualification

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Windows qualification phase
        required: true
        default: build
        type: choice
        options: [build, handoff, parity-ui, parity-normal-open, native-delivery, native-setup]

permissions:
  contents: read

concurrency:
  group: windows-rc21-recovery
  cancel-in-progress: false

jobs:
  parity_ui:
    if: inputs.phase == 'parity-ui' || inputs.phase == 'parity-normal-open' || inputs.phase == 'native-delivery' || inputs.phase == 'native-setup'
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      PYTHONPATH: source/collector;source/collector/tests;source/collector/windows;source/collector/windows/tests;source/script
    steps:
      - name: Preserve exact committed source bytes on Windows
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Verify fixed lock bytes before environment setup
        shell: pwsh
        run: |
          $hash = (Get-FileHash source/collector/windows-requirements.lock -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'aa8ee933827681ebda483c2a889dc6156f7d9de906fe21d90f055fd06939c95d') { throw 'Windows checkout changed the exact locked dependency bytes' }
          "WINDOWS_LOCK_SHA256=$hash"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.10'
          architecture: x64
          cache: ''
      - name: Assert accepted exact Windows Python runtime
        shell: pwsh
        run: |
          python -c "import platform,sys; assert platform.python_implementation() == 'CPython' and sys.version_info[:3] == (3,12,10); print(platform.python_version())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install exact locked Windows runtime
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r source/collector/windows-requirements.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Measure normal opening against the actual desktop work area
        if: inputs.phase == 'parity-ui' || inputs.phase == 'parity-normal-open'
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'AmplifaiParityRender\normal-open'
          python source/collector/windows/tests/render_contact_workspace.py --source source --logo source/public/brand/amplifai-by-nexus-original.png --output $output --normal-open-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qualify actual Windows setup delivery with synthetic links
        if: inputs.phase == 'native-delivery'
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'AmplifaiNativeDelivery'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          python source/collector/windows/tests/qualify_setup_delivery.py --output $output 2>&1 | Tee-Object -FilePath (Join-Path $output 'tests.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify platform state and contact workspace guards
        if: inputs.phase == 'parity-ui'
        shell: pwsh
        run: |
          python -m unittest test_startup_geometry test_visible_desktop test_contact_workspace test_session test_gui_guards test_engine_wire test_destination_bridge test_windows_source_diagnostics test_video_parity test_updater test_update_handoff -v 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'AmplifaiParityTests.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native setup, run, app and discovery state boundaries
        if: inputs.phase == 'native-setup'
        shell: pwsh
        run: |
          python -m unittest test_native_setup test_native_run test_native_app test_companion_status test_contact_workspace -v 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'AmplifaiNativeSetupTests.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Render changed native setup and Continue states
        if: inputs.phase == 'native-setup'
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'AmplifaiNativeSetup'
          $desktopMode = Join-Path $output 'desktop-mode.json'
          try {
            python source/collector/windows/tests/visible_desktop.py --prepare $desktopMode
            if ($LASTEXITCODE -ne 0) { throw 'Visible desktop preparation failed' }
            python source/collector/windows/tests/render_contact_workspace.py --source source --logo source/public/brand/amplifai-by-nexus-original.png --output (Join-Path $output 'render') --native-setup
            if ($LASTEXITCODE -ne 0) { throw 'Native setup UI qualification failed' }
          } finally {
            if (Test-Path $desktopMode) {
              python source/collector/windows/tests/visible_desktop.py --restore $desktopMode
              if ($LASTEXITCODE -ne 0) { throw 'Original desktop mode restoration failed' }
            }
          }
      - name: Render synthetic native workspace and recovery states
        if: inputs.phase == 'parity-ui'
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'AmplifaiParityRender'
          $desktopMode = Join-Path $output 'desktop-mode.json'
          try {
            python source/collector/windows/tests/visible_desktop.py --prepare $desktopMode
            if ($LASTEXITCODE -ne 0) { throw 'Visible desktop preparation failed' }
            foreach ($fixture in @('contact_workspace', 'ack_recovery', 'source_diagnostic_acceptance', 'update_acceptance', 'video_parity')) {
              python "source/collector/windows/tests/render_$fixture.py" --source source --logo source/public/brand/amplifai-by-nexus-original.png --output (Join-Path $output $fixture)
              if ($LASTEXITCODE -ne 0) { throw "Visible Windows fixture failed: $fixture" }
            }
          } finally {
            if (Test-Path $desktopMode) {
              python source/collector/windows/tests/visible_desktop.py --restore $desktopMode
              if ($LASTEXITCODE -ne 0) { throw 'Original desktop mode restoration failed' }
            }
          }
      - name: Retain measured Windows qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-${{ inputs.phase }}-qualification
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/AmplifaiParityTests.log
            ${{ runner.temp }}/AmplifaiParityRender/**/*.png
            ${{ runner.temp }}/AmplifaiParityRender/**/*.json
            ${{ runner.temp }}/AmplifaiNativeDelivery/*.json
            ${{ runner.temp }}/AmplifaiNativeDelivery/*.log
            ${{ runner.temp }}/AmplifaiNativeSetupTests.log
            ${{ runner.temp }}/AmplifaiNativeSetup/**/*.png
            ${{ runner.temp }}/AmplifaiNativeSetup/**/*.json

  windows:
    if: inputs.phase == 'build'
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      PYTHONPATH: source/collector;source/collector/tests;source/collector/windows;source/collector/windows/tests;source/script
    steps:
      - name: Preserve exact committed source bytes on Windows
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Verify fixed lock bytes before environment setup
        shell: pwsh
        run: |
          $hash = (Get-FileHash source/collector/windows-requirements.lock -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'aa8ee933827681ebda483c2a889dc6156f7d9de906fe21d90f055fd06939c95d') { throw 'Windows checkout changed the exact locked dependency bytes' }
          "WINDOWS_LOCK_SHA256=$hash"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.10'
          architecture: x64
          cache: ''
      - name: Assert accepted exact Windows Python runtime
        shell: pwsh
        run: |
          python -c "import platform,sys; assert platform.python_implementation() == 'CPython' and sys.version_info[:3] == (3,12,10); print(platform.python_version())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install exact locked Windows runtime
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r source/collector/windows-requirements.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qualify diagnostics retention, Windows DACLs, session gates and update verifier
        shell: pwsh
        run: |
          python -m unittest test_sqlite_encrypted_size_compat test_sqlite_messages_size_compat test_windows_source_diagnostics test_source_diagnostics test_source_diagnostic_flow test_updater test_update_handoff test_session test_gui_guards test_video_parity test_companion_status test_windows_candidate test_windows_msi -v 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'AmplifaiUnitTests.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qualify full-size one-page encrypted Messages extraction
        shell: pwsh
        run: |
          python source/collector/tests/qualify_messages_snapshot.py 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'AmplifaiMessagesSnapshot.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare actual desktop for required package render gates
        shell: pwsh
        run: |
          python source/collector/windows/tests/visible_desktop.py --prepare (Join-Path $env:RUNNER_TEMP 'AmplifaiBuildDesktop.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Render changed update states using existing Tk style
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'AmplifaiUpdateRender'
          python source/collector/windows/tests/render_update_acceptance.py --source source --logo source/public/brand/amplifai-by-nexus-original.png --output $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Render current and previous source diagnostics with existing Tk primitives
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'AmplifaiDiagnosticRender'
          python source/collector/windows/tests/render_source_diagnostic_acceptance.py --source source --logo source/public/brand/amplifai-by-nexus-original.png --output $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore package qualification desktop
        if: always()
        shell: pwsh
        run: |
          $mode = Join-Path $env:RUNNER_TEMP 'AmplifaiBuildDesktop.json'
          if (Test-Path $mode) {
            python source/collector/windows/tests/visible_desktop.py --restore $mode
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Freeze rc21 wrapper and matching shared helper
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'AmplifaiPhoneCandidate'
          python source/script/build_windows_candidate.py --source source --python (Get-Command python).Source --output $output --legal-root .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $render = Get-Content (Join-Path $env:RUNNER_TEMP 'AmplifaiUpdateRender\render-update-receipt.json') -Raw | ConvertFrom-Json
          $frozen = Get-Content (Join-Path $output 'candidate-receipt.json') -Raw | ConvertFrom-Json
          if ($render.guiSourceSha256 -ne $frozen.gui_source_sha256) { throw 'Rendered update source differs from frozen wrapper' }
          $diagnostic = Get-Content (Join-Path $env:RUNNER_TEMP 'AmplifaiDiagnosticRender\render-source-diagnostic-receipt.json') -Raw | ConvertFrom-Json
          if ($diagnostic.guiSourceSha256 -ne $frozen.gui_source_sha256) { throw 'Rendered diagnostic source differs from frozen wrapper' }
      - name: Qualify the exact frozen encrypted Messages worker
        shell: pwsh
        run: |
          $candidate = Join-Path $env:RUNNER_TEMP 'AmplifaiPhoneCandidate'
          $helper = Join-Path $candidate 'wrapper-dist\AmplifaiPhone\resources\phone-helper\AmplifaiPhoneHelper.exe'
          python source/collector/windows/tests/qualify_frozen_encrypted_worker.py --helper $helper 2>&1 | Tee-Object -FilePath (Join-Path $candidate 'frozen-encrypted-worker-receipt.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build rc21 per-user MSI with unchanged UpgradeCode
        shell: pwsh
        run: |
          $wixBin = 'C:\Program Files (x86)\WiX Toolset v3.14\bin'
          $candle = Join-Path $wixBin 'candle.exe'
          $light = Join-Path $wixBin 'light.exe'
          if (-not (Test-Path $candle) -or -not (Test-Path $light)) { throw 'Existing standard-runner WiX 3.14 missing' }
          if ((Get-Item $candle).VersionInfo.FileVersion -notlike '3.14.*' -or (Get-Item $light).VersionInfo.FileVersion -notlike '3.14.*') { throw 'Unexpected WiX version' }
          $candidate = Join-Path $env:RUNNER_TEMP 'AmplifaiPhoneCandidate'
          $installer = Join-Path $env:RUNNER_TEMP 'AmplifaiPhoneInstaller'
          python source/script/build_windows_msi.py --package (Join-Path $candidate 'wrapper-dist\AmplifaiPhone') --receipt (Join-Path $candidate 'candidate-receipt.json') --output $installer --candle $candle --light $light
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qualify in-place released rc20 to rc21 upgrade under runner user
        shell: pwsh
        run: |
          # These unattended commands qualify MSI replacement on the disposable runner only.
          # The app invokes only normal msiexec /i UI after explicit local approval.
          $installer = Join-Path $env:RUNNER_TEMP 'AmplifaiPhoneInstaller'
          $baseline = Join-Path $installer 'AmplifaiPhone-rc20-unsigned.msi'
          Invoke-WebRequest -Uri 'https://github.com/JmooreOsirs/amplifai-phone-companion/releases/download/windows-2026.10.21-rc20-unsigned-test/AmplifaiPhone-rc20-unsigned.msi' -OutFile $baseline -TimeoutSec 180
          if ((Get-Item $baseline).Length -ne 42285215 -or (Get-FileHash $baseline -Algorithm SHA256).Hash.ToLowerInvariant() -ne '6c138c0c4b935908b8632f365e6f80178e1abb7e170aa59fbbab16a42b97dd0c') { throw 'Released rc20 MSI bytes differ from fixed baseline' }
          $msi = Join-Path $installer 'AmplifaiPhone-rc21-unsigned.msi'
          $candidate = Join-Path $env:RUNNER_TEMP 'AmplifaiPhoneCandidate'
          $installed = Join-Path $env:LOCALAPPDATA 'AMPLIFaiPhone'
          $dataRoot = Join-Path $env:LOCALAPPDATA 'AMPLIFai Phone Candidate'
          if ((Test-Path $installed) -or (Test-Path $dataRoot)) { throw 'Qualification paths must be clean runner-owned paths' }
          $sessionRoot = Join-Path $dataRoot 'sessions'
          New-Item -ItemType Directory -Path $sessionRoot | Out-Null
          $sentinel = Join-Path $sessionRoot 'ci-upgrade-sentinel.txt'
          [IO.File]::WriteAllText($sentinel, 'runner-only update data preservation')
          $sentinelHash = (Get-FileHash $sentinel -Algorithm SHA256).Hash
          try {
            foreach ($package in @($baseline, $msi)) {
              $log = Join-Path $installer ((Split-Path $package -Leaf) + '.install.log')
              $operation = Start-Process -FilePath msiexec.exe -ArgumentList "/i `"$package`" /qn /norestart /L*V `"$log`"" -Wait -PassThru
              if ($operation.ExitCode -ne 0) { throw "Runner MSI installation failed: $($operation.ExitCode)" }
              if (-not (Test-Path $sentinel) -or (Get-FileHash $sentinel -Algorithm SHA256).Hash -ne $sentinelHash) { throw 'Existing session data changed during MSI replacement' }
            }
            python source/script/verify_windows_install.py --install $installed --receipt (Join-Path $candidate 'candidate-receipt.json')
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $receipt = [ordered]@{status='runner-user-rc20-to-rc21-in-place-upgrade'; oldInstallerSha256='6c138c0c4b935908b8632f365e6f80178e1abb7e170aa59fbbab16a42b97dd0c'; version='1.0.21'; upgradeCode='0C4BE78C-C5E1-4EA9-841B-4D8D93F45871'; sessionSentinelPreserved=$true; normalConsumerUiProved=$false; physicalPhoneOrAccountProved=$false}
            $receipt | ConvertTo-Json | Set-Content (Join-Path $installer 'upgrade-receipt.json') -Encoding utf8
            Get-Content (Join-Path $installer 'upgrade-receipt.json')
          } finally {
            $remove = Start-Process -FilePath msiexec.exe -ArgumentList "/x `"$msi`" /qn /norestart" -Wait -PassThru
            if ($remove.ExitCode -ne 0) { throw "Runner MSI cleanup failed: $($remove.ExitCode)" }
            python source/script/verify_windows_install.py --install $installed --receipt (Join-Path $candidate 'candidate-receipt.json') --removed
            if ($LASTEXITCODE -ne 0) { throw 'Runner uninstall left package files' }
            if (-not (Test-Path $sentinel) -or (Get-FileHash $sentinel -Algorithm SHA256).Hash -ne $sentinelHash) { throw 'Uninstall touched session data' }
            Remove-Item -LiteralPath $sentinel
            Remove-Item -LiteralPath $sessionRoot
            Remove-Item -LiteralPath $dataRoot
          }
      - name: Show bounded build diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          foreach ($directory in @('AmplifaiPhoneCandidate', 'AmplifaiPhoneInstaller')) {
            $path = Join-Path $env:RUNNER_TEMP $directory
            if (Test-Path $path) { Get-ChildItem -LiteralPath $path -Filter '*.log' | ForEach-Object { Get-Content $_.FullName -Tail 25 } }
          }
      - name: Retain bounded qualification receipts and rendered states
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-rc21-qualification
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/AmplifaiUnitTests.log
            ${{ runner.temp }}/AmplifaiMessagesSnapshot.log
            ${{ runner.temp }}/AmplifaiBuildDesktop.json
            ${{ runner.temp }}/AmplifaiDiagnosticRender/*.png
            ${{ runner.temp }}/AmplifaiDiagnosticRender/render-source-diagnostic-receipt.json
            ${{ runner.temp }}/AmplifaiUpdateRender/*.png
            ${{ runner.temp }}/AmplifaiUpdateRender/render-update-receipt.json
            ${{ runner.temp }}/AmplifaiPhoneCandidate/candidate-receipt.json
            ${{ runner.temp }}/AmplifaiPhoneCandidate/frozen-encrypted-worker-receipt.json
            ${{ runner.temp }}/AmplifaiPhoneInstaller/AmplifaiPhone-rc21-unsigned.msi
            ${{ runner.temp }}/AmplifaiPhoneInstaller/msi-receipt.json
            ${{ runner.temp }}/AmplifaiPhoneInstaller/upgrade-receipt.json
            ${{ runner.temp }}/AmplifaiPhoneInstaller/*.log

  handoff:
    permissions:
      contents: read
      actions: read
    if: github.event_name == 'workflow_dispatch' && inputs.phase == 'handoff'
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      PYTHONPATH: source/collector;source/collector/windows;source/script
    steps:
      - name: Preserve exact committed source bytes on Windows
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Verify fixed lock bytes before environment setup
        shell: pwsh
        run: |
          $hash = (Get-FileHash source/collector/windows-requirements.lock -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'aa8ee933827681ebda483c2a889dc6156f7d9de906fe21d90f055fd06939c95d') { throw 'Windows checkout changed the exact locked dependency bytes' }
          "WINDOWS_LOCK_SHA256=$hash"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.10'
          architecture: x64
          cache: ''
      - name: Assert accepted exact Windows Python runtime
        shell: pwsh
        run: |
          python -c "import platform,sys; assert platform.python_implementation() == 'CPython' and sys.version_info[:3] == (3,12,10); print(platform.python_version())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install existing exact locked runtime
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r source/collector/windows-requirements.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qualify bounded Pillow source evidence export
        shell: pwsh
        run: |
          python -m unittest test_windows_pillow_evidence -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fetch only pinned build artifact and signed qualification fixture
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Reuse the exact successful rc21 build and exact signed qualification bytes.
          # The normal frozen verifier independently validates the signed fixture.
          $repository = 'JmooreOsirs/amplifai-phone-companion'
          $artifactId = 12447857716
          $artifact = gh api "repos/$repository/actions/artifacts/$artifactId" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $artifact.id -ne $artifactId -or $artifact.name -ne 'windows-rc21-qualification' -or $artifact.expired -ne $false -or $artifact.workflow_run.id -ne 39828244482 -or $artifact.size_in_bytes -ne 44854537 -or $artifact.digest -ne 'sha256:1aab0a3acc0335e4a0171102e0617f099e448f9b2e1d7dbb0b62cacdf46e9a46') { throw 'Fixed rc21 build artifact metadata differs' }
          $build = gh api "repos/$repository/actions/runs/39828244482" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $build.head_sha -ne 'efffc39d0012ec49e8530cd8412435d87a977163' -or $build.status -ne 'completed' -or $build.conclusion -ne 'success') { throw 'Fixed rc21 build qualification differs' }
          $fixture = Join-Path $env:RUNNER_TEMP 'AmplifaiHandoffFixture'
          New-Item -ItemType Directory -Path $fixture | Out-Null
          $archive = Join-Path $fixture 'qualified-build.zip'
          @'
          import subprocess, sys
          with open(sys.argv[1], 'xb') as target:
              subprocess.run(['gh', 'api', 'repos/JmooreOsirs/amplifai-phone-companion/actions/artifacts/12447857716/zip'], stdout=target, check=True, timeout=180)
          '@ | python - $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-Item $archive).Length -ne 44854537 -or (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '1aab0a3acc0335e4a0171102e0617f099e448f9b2e1d7dbb0b62cacdf46e9a46') { throw 'Fixed rc21 artifact ZIP bytes differ' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($archive)
          try {
            $expected = @(
              @{entry='AmplifaiPhoneInstaller/AmplifaiPhone-rc21-unsigned.msi'; name='AmplifaiPhone-rc21-unsigned.msi'; bytes=42289311; sha='cb252aa6149d29731b262809610bea79f7d39d349c84f48d02ec6f20fdf3d583'},
              @{entry='AmplifaiPhoneCandidate/candidate-receipt.json'; name='candidate-receipt.json'; bytes=1666490; sha='8ef95d4654bd0290b73f9261f4389fb2f7dfcea24e26bf9b39e11ff35e14ea46'}
            )
            foreach ($record in $expected) {
              $entries = @($zip.Entries | Where-Object { $_.FullName -ceq $record.entry })
              if ($entries.Count -ne 1 -or $entries[0].Length -ne $record.bytes) { throw 'Fixed artifact member differs' }
              $destination = Join-Path $fixture $record.name
              $inputStream = $entries[0].Open()
              try {
                $outputStream = [IO.File]::Open($destination, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write)
                try { $inputStream.CopyTo($outputStream) } finally { $outputStream.Dispose() }
              } finally { $inputStream.Dispose() }
              if ((Get-Item $destination).Length -ne $record.bytes -or (Get-FileHash $destination -Algorithm SHA256).Hash.ToLowerInvariant() -ne $record.sha) { throw 'Fixed artifact member bytes differ' }
            }
          } finally { $zip.Dispose() }
          Remove-Item -LiteralPath $archive
          $signed = 'source/collector/windows/tests/fixtures/release-qualification/rc21'
          $signedFiles = @(
            @{name='update-v1.json'; bytes=581; sha='48053f418248d3463e07ea1533124957bac99c36f98d0ff132aa8a6a6e977897'},
            @{name='update-v1.json.sig'; bytes=89; sha='097a21a7e90487048f2ab0b6210e685ae0ce335353cd404bd43fe030767f6a16'}
          )
          foreach ($record in $signedFiles) {
            $source = Join-Path $signed $record.name
            if ((Get-Item $source).Length -ne $record.bytes -or (Get-FileHash $source -Algorithm SHA256).Hash.ToLowerInvariant() -ne $record.sha) { throw 'Fixed signed qualification fixture differs' }
            Copy-Item -LiteralPath $source -Destination (Join-Path $fixture $record.name)
          }
          Invoke-WebRequest -Uri 'https://github.com/JmooreOsirs/amplifai-phone-companion/releases/download/windows-2026.10.21-rc20-unsigned-test/AmplifaiPhone-rc20-unsigned.msi' -OutFile (Join-Path $fixture 'AmplifaiPhone-rc20-unsigned.msi') -TimeoutSec 180
      - name: Qualify copied frozen helper readiness and running-old-app replacement
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'AmplifaiHandoffFixture'
          python source/script/qualify_windows_update_handoff.py --msi (Join-Path $fixture 'AmplifaiPhone-rc21-unsigned.msi') --baseline (Join-Path $fixture 'AmplifaiPhone-rc20-unsigned.msi') --manifest (Join-Path $fixture 'update-v1.json') --signature (Join-Path $fixture 'update-v1.json.sig') --candidate-receipt (Join-Path $fixture 'candidate-receipt.json') --output (Join-Path $fixture 'handoff-receipt.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain actual frozen handoff receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-rc21-handoff-qualification
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/AmplifaiHandoffFixture/handoff-receipt.json
            ${{ runner.temp }}/AmplifaiHandoffFixture/native-source-evidence/*
