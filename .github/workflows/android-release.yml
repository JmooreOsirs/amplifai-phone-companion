name: Protected Android release
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [inspect, sign, publish]
        default: inspect
        required: true
      version:
        description: Exact version admitted by protected Android policy
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: android-official-release
  cancel-in-progress: false
env:
  RELEASE_VERSION: ${{ inputs.version }}
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  inspect:
    name: android-inspect
    if: github.repository == 'JmooreOsirs/amplifai-phone-companion' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: amplifai-release-publication
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.authorization.outputs.artifact-id }}
      artifact-digest: ${{ steps.authorization.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate exact approved build artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_POLICY_AUDIT_TOKEN: ${{ secrets.RELEASE_POLICY_AUDIT_TOKEN }}
        run: python3 release_control/android_release.py inspect --output "$RUNNER_TEMP/android-inspection"
      - name: Retain same-run protected authorization
        id: authorization
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-inspection-${{ github.run_id }}
          path: ${{ runner.temp }}/android-inspection/authorization.json
          if-no-files-found: error
          retention-days: 1
  sign:
    name: android-sign
    needs: inspect
    if: inputs.mode == 'sign'
    environment: amplifai-android-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare exact trusted signing tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"'
      - name: Sign exact admitted APK and feed without executing candidate code
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_AUTHORIZATION_ARTIFACT_ID: ${{ needs.inspect.outputs.artifact-id }}
          ANDROID_AUTHORIZATION_ARTIFACT_SHA256: ${{ needs.inspect.outputs.artifact-digest }}
          ANDROID_RELEASE_PKCS12_BASE64: ${{ secrets.ANDROID_RELEASE_PKCS12_BASE64 }}
          ANDROID_RELEASE_PASSWORD: ${{ secrets.ANDROID_RELEASE_PASSWORD }}
        run: python3 release_control/android_release.py sign --output "$RUNNER_TEMP/android-signed"
      - name: Clean surviving private signing files
        if: always()
        shell: python
        run: |
          import os, pathlib, shutil
          root = pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
          for path in root.glob('amplifai-android-keys-*'):
              if path.is_symlink() or path.resolve().parent != root:
                  raise RuntimeError('Unexpected signing cleanup path')
              shutil.rmtree(path)
      - name: Retain exact signed candidate for runtime qualification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-signed-${{ github.run_id }}
          path: ${{ runner.temp }}/android-signed/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  publish:
    needs: inspect
    if: inputs.mode == 'publish'
    environment: amplifai-release-publication
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare independent signature verifier
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"'
      - name: Publish runtime-qualified artifact and verify public bodies
        env:
          GH_TOKEN: ${{ github.token }}
          GH_POLICY_AUDIT_TOKEN: ${{ secrets.RELEASE_POLICY_AUDIT_TOKEN }}
        run: python3 release_control/android_publish.py --output "$RUNNER_TEMP/android-publication"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/android-publication/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
