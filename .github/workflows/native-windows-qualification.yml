name: Windows reduced-token storage qualification

on:
  push:
    branches: [codex/oct1-native-qualification]

permissions:
  contents: read

concurrency:
  group: oct1-windows-qualification
  cancel-in-progress: false

jobs:
  windows:
    # Standard PUBLIC-repository runner minutes are free. No cache/artifact storage.
    runs-on: windows-2025
    timeout-minutes: 7
    env:
      PYTHONPATH: source/collector
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: x64
          cache: ''
      - name: Identify Windows and runtime
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture
          python --version
          python -c "import platform; print(platform.machine())"
      # Reuse administrator software proof: run 36908082055, source 901142c.
      # This new probe is stdlib-only; no device collection or child elevation.
      - name: Verify reduced-token policy and actual synchronous storage
        timeout-minutes: 2
        shell: pwsh
        env:
          PYTHONPATH: source/collector;source/collector/tests
        run: |
          python -m unittest test_windows_restricted_token_probe -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python source/collector/tests/windows_restricted_token_probe.py
