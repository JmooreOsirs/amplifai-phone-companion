name: Windows companion administrator-runner software qualification

on:
  push:
    branches: [codex/oct1-native-qualification]

permissions:
  contents: read

concurrency:
  group: oct1-windows-qualification
  cancel-in-progress: false

jobs:
  windows:
    # Standard PUBLIC-repository runner minutes are free. No cache/artifact storage.
    runs-on: windows-2025
    timeout-minutes: 7
    env:
      PYTHONPATH: source/collector
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: x64
          cache: ''
      - name: Identify Windows and runtime
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture
          python --version
          python -c "import platform; print(platform.machine())"
      - name: Install exact hash-pinned Windows dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r source/collector/windows-requirements.lock
      - name: Fail fast on native owner-ACL and PID proof (administrator runner)
        timeout-minutes: 2
        run: python -m unittest discover -s source/collector/tests -p test_windows_storage.py -v
      - name: Qualify only changed cancellation and private workspace paths
        timeout-minutes: 2
        env:
          PYTHONPATH: source/collector;source/collector/tests
        run: python -m unittest test_backup_watchdog.CollectionAbortTest test_workspace -v
      - name: Verify runtime without connecting to a phone
        run: |
          python -m amplifai_phone.agent runtime-check
          python -m amplifai_phone.agent inspect
          python -c "import tkinter as tk; window=tk.Tk(); window.withdraw(); window.update(); window.destroy(); print('Windows native Tk runtime ready')"
