name: Release control checks
on:
  pull_request:
  push:
    branches: [main, release/native]
permissions:
  contents: read
jobs:
  native-phone-run:
    name: native-phone-run-checks
    if: github.base_ref == 'release/native' || github.ref == 'refs/heads/release/native'
    runs-on: macos-15
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.10.2'
          enable-cache: false
      - name: Prepare the existing locked qualification interpreter
        run: |
          uv venv --python 3.12.12 "$RUNNER_TEMP/phone-run-venv"
          uv pip sync --require-hashes --python "$RUNNER_TEMP/phone-run-venv/bin/python" source/collector/portable-requirements.lock
      - name: Check model, hidden AppKit lifecycle and synthetic bridge recovery
        run: '"$RUNNER_TEMP/phone-run-venv/bin/python" release_control/check_phone_run.py --checkout "$GITHUB_WORKSPACE"'
  test:
    name: release-control-checks
    needs: native-phone-run
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require native checks for native source changes
        env:
          NATIVE_RESULT: ${{ needs.native-phone-run.result }}
          NATIVE_REQUIRED: ${{ github.base_ref == 'release/native' || github.ref == 'refs/heads/release/native' }}
        run: |
          if [ "$NATIVE_REQUIRED" = true ]; then
            test "$NATIVE_RESULT" = success
          else
            test "$NATIVE_RESULT" = skipped
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: PYTHONDONTWRITEBYTECODE=1 python3 -W error -m unittest discover -s release_control -p 'test_*.py' -v

  android-policy-read-probe:
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/android-release-workflow-oct24'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Probe branch protection read with job-scoped token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYPROBE'
          import json, subprocess
          fields = 'isAdminEnforced dismissesStaleReviews requiresApprovingReviews requiredApprovingReviewCount requiresCodeOwnerReviews requireLastPushApproval allowsForcePushes allowsDeletions requiresStatusChecks requiresStrictStatusChecks requiredStatusChecks{context app{databaseId}} bypassPullRequestAllowances(first:100){totalCount}'
          refs = ' '.join(alias + ':ref(qualifiedName:"refs/heads/' + branch + '"){branchProtectionRule{' + fields + '}}' for alias, branch in [('main','main'),('native','release/native')])
          query = '{repository(owner:"JmooreOsirs",name:"amplifai-phone-companion"){' + refs + '}}'
          result = subprocess.run(['gh','api','graphql','--input','-'], input=json.dumps({'query':query}), text=True, capture_output=True, timeout=30)
          try:
              value = json.loads(result.stdout)
          except (ValueError, TypeError):
              value = {}
          print(json.dumps({'available':result.returncode == 0 and not value.get('errors'), 'data':value.get('data'), 'errorTypes':[e.get('type') for e in value.get('errors',[])]}, sort_keys=True))
          for name in ('amplifai-android-signing','amplifai-release-publication'):
              for suffix in ('','/deployment-branch-policies'):
                  result = subprocess.run(['gh','api','repos/JmooreOsirs/amplifai-phone-companion/environments/'+name+suffix], text=True, capture_output=True, timeout=30)
                  try:
                      value = json.loads(result.stdout)
                  except (ValueError, TypeError):
                      value = {}
                  fields = ('deployment_branch_policy','protection_rules') if not suffix else ('branch_policies','total_count')
                  print(json.dumps({'environment':name,'path':suffix,'available':result.returncode == 0, 'data':{k:value.get(k) for k in fields}}, sort_keys=True))
          PYPROBE
