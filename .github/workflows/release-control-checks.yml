name: Release control checks
on:
  pull_request:
  push:
    branches: [main, release/native]
permissions:
  contents: read
jobs:
  test:
    name: release-control-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: PYTHONDONTWRITEBYTECODE=1 python3 -W error -m unittest discover -s release_control -p 'test_*.py' -v
