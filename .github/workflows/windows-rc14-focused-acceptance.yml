name: Windows rc14 retained-MSI standard-user acceptance

on:
  push:
    branches: [codex/windows-rc14-focused-acceptance]

permissions:
  # GitHub's draft-release API hides private draft assets from read-only Actions tokens.
  # This token is confined to this run; no release mutation occurs in this workflow.
  contents: write

jobs:
  focused:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      PYTHONPATH: source/collector;source/collector/windows;source/collector/windows/tests;source/script
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: x64
          cache: ''
      - name: Download and authenticate exact retained private MSI
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'AmplifaiRc14Retained'
          New-Item -ItemType Directory -Path $target -ErrorAction Stop | Out-Null
          gh release download windows-rc14-private-66066519b1b0 --repo JmooreOsirs/amplifai-phone-companion --dir $target --pattern 'AmplifaiPhone-rc14-unsigned.msi' --pattern 'candidate-receipt.json'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $msi = Join-Path $target 'AmplifaiPhone-rc14-unsigned.msi'
          if ((Get-Item $msi).Length -ne 41001852 -or (Get-FileHash -Algorithm SHA256 $msi).Hash.ToLower() -ne '887d367e602fccc8d8245964443f1d62eb3885a7311039d471a3c07d819cfafb') { throw 'Retained MSI identity mismatch' }
          $frozen = Join-Path $target 'candidate-receipt.json'
          if ((Get-FileHash -Algorithm SHA256 $frozen).Hash.ToLower() -ne '8b2f369debb7652f04b9f96524be294af7d817c027b1acf2e2d163e72ac793aa') { throw 'Retained package receipt mismatch' }
      - name: Install and remove retained MSI under disposable standard user
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'AmplifaiRc14Retained'
          ./source/script/check_windows_nonadmin_msi.ps1 -Msi (Join-Path $target 'AmplifaiPhone-rc14-unsigned.msi') -FrozenReceipt (Join-Path $target 'candidate-receipt.json')
      - name: Keep only the compact standard-user receipt on the runner
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-rc14-focused-acceptance
          path: |
            ${{ runner.temp }}/nonadmin-receipt.json
          retention-days: 7
          if-no-files-found: warn
